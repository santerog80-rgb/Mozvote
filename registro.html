<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registar — MOZVOTE SUPREMO</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --verde:#009A44; --vermelho:#C8102E; --amarelo:#FFD700; --preto:#0a0a0a; --branco:#f5f5f5; --dourado:#B8860B; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Source Sans 3',sans-serif; background:var(--preto); color:var(--branco); min-height:100vh; display:flex; flex-direction:column; }
  .flag-stripe { height:6px; background:linear-gradient(90deg,var(--verde) 33%,var(--preto) 33%,var(--preto) 34%,var(--amarelo) 34%,var(--amarelo) 66%,var(--preto) 66%,var(--preto) 67%,var(--vermelho) 67%); }
  .top-nav { background:rgba(255,255,255,0.03); border-bottom:1px solid rgba(255,255,255,0.08); padding:15px 20px; display:flex; align-items:center; gap:15px; }
  .top-nav a { color:rgba(255,255,255,0.5); text-decoration:none; font-size:0.85rem; letter-spacing:1px; }
  .top-nav .nav-title { font-family:'Oswald',sans-serif; font-size:1.1rem; color:var(--amarelo); letter-spacing:2px; margin-left:auto; }
  .container { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .card {
    background:linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.1);
    border-radius:16px;
    padding:50px 40px;
    width:100%; max-width:480px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .card-header { text-align:center; margin-bottom:40px; }
  .card-icon { font-size:3rem; margin-bottom:15px; }
  .card-header h2 { font-family:'Oswald',sans-serif; font-size:1.8rem; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--amarelo); }
  .card-header p { color:rgba(255,255,255,0.4); font-size:0.9rem; margin-top:8px; }
  .form-group { margin-bottom:22px; }
  label { display:block; font-size:0.8rem; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.5); margin-bottom:8px; }
  input {
    width:100%; padding:14px 18px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:8px;
    color:var(--branco);
    font-family:'Source Sans 3',sans-serif;
    font-size:1rem;
    transition:all 0.3s;
    outline:none;
  }
  input:focus { border-color:var(--verde); background:rgba(0,154,68,0.1); box-shadow:0 0 0 3px rgba(0,154,68,0.15); }
  input::placeholder { color:rgba(255,255,255,0.25); }
  .btn {
    width:100%; padding:16px;
    background:linear-gradient(135deg, var(--verde), #006b2e);
    color:white; border:none; border-radius:8px;
    font-family:'Oswald',sans-serif; font-size:1.1rem;
    letter-spacing:3px; text-transform:uppercase;
    cursor:pointer; transition:all 0.3s; margin-top:10px;
  }
  .btn:hover { filter:brightness(1.15); transform:translateY(-2px); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
  .divider { text-align:center; color:rgba(255,255,255,0.2); margin:25px 0; font-size:0.8rem; }
  .link { display:block; text-align:center; color:var(--amarelo); text-decoration:none; font-size:0.9rem; transition:opacity 0.2s; }
  .link:hover { opacity:0.8; }
  .alert { padding:12px 16px; border-radius:8px; font-size:0.9rem; margin-bottom:20px; display:none; }
  .alert.error { background:rgba(200,16,46,0.2); border:1px solid rgba(200,16,46,0.4); color:#ff6b6b; }
  .alert.success { background:rgba(0,154,68,0.2); border:1px solid rgba(0,154,68,0.4); color:#4cde8a; }
  .strength-bar { height:4px; background:rgba(255,255,255,0.1); border-radius:2px; margin-top:8px; overflow:hidden; }
  .strength-fill { height:100%; width:0; transition:all 0.3s; border-radius:2px; }
  .password-toggle { position:relative; }
  .toggle-btn { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; color:rgba(255,255,255,0.4); cursor:pointer; font-size:1rem; padding:0; }
  .rules { font-size:0.8rem; color:rgba(255,255,255,0.3); margin-top:8px; }
  @keyframes slideIn { from{transform:translateX(100px);opacity:0} to{transform:translateX(0);opacity:1} }
</style>
</head>
<body>
<div class="flag-stripe"></div>
<nav class="top-nav">
  <a href="index.html">← Início</a>
  <span class="nav-title">MOZVOTE SUPREMO</span>
</nav>
<div class="container">
  <div class="card">
    <div class="card-header">
      <div class="card-icon">📝</div>
      <h2>Criar Conta</h2>
      <p>Registe-se para participar nas eleições</p>
    </div>
    <div class="alert error" id="alertError"></div>
    <div class="alert success" id="alertSuccess"></div>
    <form id="registroForm">
      <div class="form-group">
        <label>Nome Completo</label>
        <input type="text" id="nome" placeholder="Ex: João Manuel Sitoe" required autocomplete="off">
      </div>
      <div class="form-group">
        <label>Bilhete de Identidade (BI)</label>
        <input type="text" id="bi" placeholder="Ex: 123456789M" required autocomplete="off" maxlength="12">
        <div class="rules">Apenas letras maiúsculas e números</div>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <div class="password-toggle">
          <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
          <button type="button" class="toggle-btn" onclick="togglePwd('senha')">👁️</button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      </div>
      <div class="form-group">
        <label>Confirmar Senha</label>
        <div class="password-toggle">
          <input type="password" id="confirmarSenha" placeholder="Repita a senha" required autocomplete="new-password">
          <button type="button" class="toggle-btn" onclick="togglePwd('confirmarSenha')">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn" id="submitBtn">CRIAR CONTA</button>
    </form>
    <div class="divider">— Já tem conta? —</div>
    <a href="login.html" class="link">Fazer Login</a>
  </div>
</div>

<script src="js/config.js"></script>
<script>
  function togglePwd(id) {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
  }

  document.getElementById('senha').addEventListener('input', function() {
    const val = this.value;
    const fill = document.getElementById('strengthFill');
    let strength = 0;
    if (val.length >= 6) strength += 25;
    if (val.length >= 10) strength += 25;
    if (/[A-Z]/.test(val) && /[0-9]/.test(val)) strength += 25;
    if (/[^a-zA-Z0-9]/.test(val)) strength += 25;
    const colors = ['#C8102E','#FF6600','#FFD700','#009A44'];
    fill.style.width = strength + '%';
    fill.style.background = colors[Math.floor(strength/26)] || '#009A44';
  });

  document.getElementById('bi').addEventListener('input', function() {
    this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  });

  document.getElementById('registroForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const errEl = document.getElementById('alertError');
    const sucEl = document.getElementById('alertSuccess');
    errEl.style.display = 'none';
    sucEl.style.display = 'none';

    const nome = document.getElementById('nome').value.trim();
    const bi = document.getElementById('bi').value.trim();
    const senha = document.getElementById('senha').value;
    const confirmar = document.getElementById('confirmarSenha').value;
    const btn = document.getElementById('submitBtn');

    if (nome.split(' ').length < 2) {
      errEl.textContent = '⚠️ Insira o nome completo (nome e apelido).';
      errEl.style.display = 'block'; return;
    }
    if (bi.length < 8) {
      errEl.textContent = '⚠️ O BI deve ter pelo menos 8 caracteres.';
      errEl.style.display = 'block'; return;
    }
    if (senha !== confirmar) {
      errEl.textContent = '⚠️ As senhas não coincidem.';
      errEl.style.display = 'block'; return;
    }

    const { url, key } = getSBConfig();
    if (!url || !key) {
      errEl.textContent = '⚠️ Supabase não configurado. Aceda ao painel admin para configurar.';
      errEl.style.display = 'block'; return;
    }

    btn.disabled = true;
    btn.textContent = 'A REGISTAR...';

    try {
      // Check if BI already exists
      const existing = await sbGet('eleitores', `?bi=eq.${encodeURIComponent(bi)}`);
      if (existing && existing.length > 0) {
        errEl.textContent = '⚠️ Este BI já está registado no sistema.';
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'CRIAR CONTA'; return;
      }

      await sbPost('eleitores', { nome, bi, senha: hashSenha(senha), votou: false });
      sucEl.textContent = '✅ Conta criada com sucesso! A redirecionar para login...';
      sucEl.style.display = 'block';
      setTimeout(() => window.location.href = 'login.html', 2000);
    } catch(err) {
      errEl.textContent = '⚠️ Erro ao criar conta: ' + (err.message || 'Tente novamente.');
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'CRIAR CONTA';
    }
  });
</script>
</body>
</html>
