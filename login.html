<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — MOZVOTE SUPREMO</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --verde:#009A44; --vermelho:#C8102E; --amarelo:#FFD700; --preto:#0a0a0a; --branco:#f5f5f5; --dourado:#B8860B; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Source Sans 3',sans-serif; background:var(--preto); color:var(--branco); min-height:100vh; display:flex; flex-direction:column; }
  .flag-stripe { height:6px; background:linear-gradient(90deg,var(--verde) 33%,var(--preto) 33%,var(--preto) 34%,var(--amarelo) 34%,var(--amarelo) 66%,var(--preto) 66%,var(--preto) 67%,var(--vermelho) 67%); }
  .top-nav { background:rgba(255,255,255,0.03); border-bottom:1px solid rgba(255,255,255,0.08); padding:15px 20px; display:flex; align-items:center; gap:15px; }
  .top-nav a { color:rgba(255,255,255,0.5); text-decoration:none; font-size:0.85rem; letter-spacing:1px; }
  .nav-title { font-family:'Oswald',sans-serif; font-size:1.1rem; color:var(--amarelo); letter-spacing:2px; margin-left:auto; }
  .container { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .card {
    background:linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.1);
    border-radius:16px;
    padding:50px 40px;
    width:100%; max-width:440px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .card-header { text-align:center; margin-bottom:40px; }
  .card-icon {
    width:80px; height:80px;
    background:radial-gradient(circle, var(--amarelo), var(--dourado));
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:2.5rem; margin:0 auto 20px;
    box-shadow:0 0 30px rgba(255,215,0,0.3);
    animation:glow 2s ease-in-out infinite;
  }
  @keyframes glow { 0%,100%{box-shadow:0 0 20px rgba(255,215,0,0.3)} 50%{box-shadow:0 0 40px rgba(255,215,0,0.6)} }
  .card-header h2 { font-family:'Oswald',sans-serif; font-size:2rem; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--branco); }
  .card-header p { color:rgba(255,255,255,0.4); font-size:0.9rem; margin-top:8px; }
  .form-group { margin-bottom:22px; }
  label { display:block; font-size:0.8rem; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.5); margin-bottom:8px; }
  input {
    width:100%; padding:14px 18px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:8px; color:var(--branco);
    font-family:'Source Sans 3',sans-serif; font-size:1rem;
    transition:all 0.3s; outline:none;
  }
  input:focus { border-color:var(--amarelo); background:rgba(255,215,0,0.05); box-shadow:0 0 0 3px rgba(255,215,0,0.1); }
  input::placeholder { color:rgba(255,255,255,0.25); }
  .btn {
    width:100%; padding:16px;
    background:linear-gradient(135deg, var(--amarelo), var(--dourado));
    color:var(--preto); border:none; border-radius:8px;
    font-family:'Oswald',sans-serif; font-size:1.1rem;
    font-weight:700; letter-spacing:3px; text-transform:uppercase;
    cursor:pointer; transition:all 0.3s; margin-top:10px;
  }
  .btn:hover { filter:brightness(1.1); transform:translateY(-2px); box-shadow:0 8px 25px rgba(255,215,0,0.3); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
  .divider { text-align:center; color:rgba(255,255,255,0.2); margin:25px 0; font-size:0.8rem; }
  .link { display:block; text-align:center; color:var(--verde); text-decoration:none; font-size:0.9rem; }
  .link:hover { color:var(--amarelo); }
  .alert { padding:12px 16px; border-radius:8px; font-size:0.9rem; margin-bottom:20px; display:none; }
  .alert.error { background:rgba(200,16,46,0.2); border:1px solid rgba(200,16,46,0.4); color:#ff6b6b; }
  .password-toggle { position:relative; }
  .toggle-btn { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; color:rgba(255,255,255,0.4); cursor:pointer; font-size:1rem; }
  .voted-banner { background:rgba(255,215,0,0.15); border:1px solid rgba(255,215,0,0.4); border-radius:8px; padding:12px 16px; text-align:center; color:var(--amarelo); font-size:0.9rem; margin-bottom:20px; display:none; }
  @keyframes slideIn { from{transform:translateX(100px);opacity:0} to{transform:translateX(0);opacity:1} }
</style>
</head>
<body>
<div class="flag-stripe"></div>
<nav class="top-nav">
  <a href="index.html">← Início</a>
  <span class="nav-title">MOZVOTE SUPREMO</span>
</nav>
<div class="container">
  <div class="card">
    <div class="card-header">
      <div class="card-icon">🗝️</div>
      <h2>Login</h2>
      <p>Entre com o seu BI e senha para votar</p>
    </div>
    <div class="alert error" id="alertError"></div>
    <div class="voted-banner" id="votedBanner">✅ Já votou! Pode ver os resultados.</div>
    <form id="loginForm">
      <div class="form-group">
        <label>Bilhete de Identidade (BI)</label>
        <input type="text" id="bi" placeholder="Ex: 123456789M" required autocomplete="off" maxlength="12">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <div class="password-toggle">
          <input type="password" id="senha" placeholder="A sua senha" required autocomplete="current-password">
          <button type="button" class="toggle-btn" onclick="togglePwd()">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn" id="submitBtn">ENTRAR E VOTAR</button>
    </form>
    <div class="divider">— Não tem conta? —</div>
    <a href="registro.html" class="link">Criar Conta Agora</a>
    <div style="margin-top:15px; text-align:center;">
      <a href="resultado.html" style="color:rgba(255,255,255,0.3);font-size:0.8rem;text-decoration:none;">📊 Ver Resultados sem login</a>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script>
  document.getElementById('bi').addEventListener('input', function() {
    this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  });

  function togglePwd() {
    const el = document.getElementById('senha');
    el.type = el.type === 'password' ? 'text' : 'password';
  }

  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const errEl = document.getElementById('alertError');
    errEl.style.display = 'none';
    const bi = document.getElementById('bi').value.trim();
    const senha = document.getElementById('senha').value;
    const btn = document.getElementById('submitBtn');

    const { url, key } = getSBConfig();
    if (!url || !key) {
      errEl.textContent = '⚠️ Supabase não configurado. Contacte o administrador.';
      errEl.style.display = 'block'; return;
    }

    btn.disabled = true; btn.textContent = 'A VERIFICAR...';

    try {
      const results = await sbGet('eleitores', `?bi=eq.${encodeURIComponent(bi)}&senha=eq.${encodeURIComponent(hashSenha(senha))}`);
      if (!results || results.length === 0) {
        errEl.textContent = '⚠️ BI ou senha incorretos. Verifique e tente novamente.';
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'ENTRAR E VOTAR'; return;
      }
      const eleitor = results[0];
      // Save session
      localStorage.setItem('mozvote_user', JSON.stringify({ id: eleitor.id, nome: eleitor.nome, bi: eleitor.bi, votou: eleitor.votou }));
      if (eleitor.votou) {
        document.getElementById('votedBanner').style.display = 'block';
        btn.textContent = 'A REDIRECIONAR...';
        setTimeout(() => window.location.href = 'resultado.html', 1500);
      } else {
        window.location.href = 'votar.html';
      }
    } catch(err) {
      errEl.textContent = '⚠️ Erro de ligação: ' + (err.message || 'Tente novamente.');
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'ENTRAR E VOTAR';
    }
  });
</script>
</body>
</html>
